name: R-13 Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    timeout-minutes: 180
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run test:r13:install-engine
      - name: Verify clean source, frozen manifest, auth, and runtime profile
        run: npm run test:r13:preflight
        env:
          AGENTMEMORY_SECRET: r13-qualification-synthetic-only
          AGENTMEMORY_PROJECT_CAPABILITY_SECRET: r13-project-capability-synthetic-only
          R13_RECEIPT_DIR: .r13-receipts/preflight
      - run: npm run test:r13:validate -- .r13-receipts/preflight
      - run: npm run build
      - run: npm run skills:check
      - run: npm run test:r13:harness
      - run: npm run evidence:interfaces:test
      - run: npm run evidence:interfaces -- --check
      - name: Run five fresh R-13 profiles
        run: npm run test:r13 -- --repeat=5
        env:
          AGENTMEMORY_SECRET: r13-qualification-synthetic-only
          AGENTMEMORY_PROJECT_CAPABILITY_SECRET: r13-project-capability-synthetic-only
          R13_RECEIPT_DIR: .r13-receipts/qualification
      - run: npm run test:r13:validate -- --require-pass .r13-receipts/qualification
      - name: Upload immutable receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r13-qualification-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: .r13-receipts/qualification
          if-no-files-found: error
          retention-days: 30
